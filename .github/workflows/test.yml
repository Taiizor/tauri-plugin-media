name: Test

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo bash -c 'cat << "EOF" > /etc/resolv.conf
          nameserver 1.1.1.1
          nameserver 8.8.8.8
          nameserver 8.8.4.4
          options timeout:2 attempts:3
          EOF'
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo mkdir -p /etc/needrestart/conf.d
          echo '$nrconf{restart} = "l";' | sudo tee /etc/needrestart/conf.d/99no-prompt.conf
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y --no-install-recommends libdbus-1-dev libwebkit2gtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --all-targets --all-features