name: Clippy

on:
  push:
    branches:
      - develop
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - ".github/workflows/clippy.yml"
  pull_request:
    branches:
      - develop
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - ".github/workflows/clippy.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: install webkit2gtk
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list 2>/dev/null || true
          if [ -d /etc/apt/sources.list.d ]; then
            sudo find /etc/apt/sources.list.d/ -type f -name "*.sources" -exec sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' {} + 2>/dev/null || true
          fi
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            libwebkit2gtk-4.1-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo clippy --all-targets --all-features